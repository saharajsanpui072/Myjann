<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Saharaj EXE - Lava Theme</title>
  <!-- আইকন লাইব্রেরি -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- আলাদা CSS ফাইল লিংক -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- লাইভ আগুনের স্ফুলিঙ্গ রেন্ডারার -->
  <canvas id="fireCanvas"></canvas>

  <div class="wrapper">

    <!-- কার্ড ১: প্রোফাইল -->
    <div class="magma-plate">
      <div class="profile-fire-box">
        <div class="fire-turbulent-ring"></div>
        <img class="profile-img" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300" alt="Profile">
      </div>
      <h2 class="stone-heading">SAHARAJ EXE</h2>
      <div class="badge-online">
        <i class="fa-solid fa-bolt"></i> 24/7 ONLINE
      </div>

      <a href="#" class="magma-btn" style="justify-content: center; gap: 8px;">
        <i class="fa-brands fa-whatsapp" style="color: #25D366; font-size: 20px;"></i>
        <span style="font-weight: 800;">WhatsApp Support Owner +91 62896003</span>
      </a>
    </div>

    <!-- কার্ড ২: নাম ও ব্যালেন্স -->
    <div class="magma-plate">
      <div class="magma-btn">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="btn-fire-icon"><i class="fa-solid fa-user-gear"></i></div>
          <span style="font-weight: 800; font-size: 15px;">SAHARAJ SANPUI</span>
        </div>
        <span style="color: #00ff88; font-size: 12px; font-weight: 800;">
          <i class="fa-solid fa-circle-check"></i> ACTIVE
        </span>
      </div>

      <div class="twin-box">
        <div class="stone-card-inner">
          <small>WALLET BALANCE</small>
          <strong>₹500.32</strong>
        </div>
        <div class="stone-card-inner" style="background: radial-gradient(circle, #b32400, #400a00); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
          <i class="fa-solid fa-wallet" style="color: #fff;"></i>
          <span style="color: #fff; font-weight: 800; font-size: 14px;">DEPOSIT & HISTORY</span>
        </div>
      </div>
    </div>

    <!-- কার্ড ৩: BUY NOW -->
    <div class="magma-plate dark-plate" style="padding: 12px 14px;">
      <div class="magma-btn" style="background: transparent; border: none; box-shadow: none; padding: 0;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <div class="btn-fire-icon"><i class="fa-solid fa-cart-shopping"></i></div>
          <div>
            <div style="font-weight: 900; font-size: 17px; color: #ffdd66;">BUY NOW</div>
            <div style="font-size: 11px; color: #ff9966;">Browse all gadgets and activation keys</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: #ff7700; font-size: 18px;"></i>
      </div>
    </div>

    <!-- কার্ড ৪: MY PURCHASED KEYS -->
    <div class="magma-plate dark-plate" style="padding: 12px 14px;">
      <div class="magma-btn" style="background: transparent; border: none; box-shadow: none; padding: 0;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <div class="btn-fire-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
          <div>
            <div style="font-weight: 900; font-size: 17px; color: #ffdd66;">MY PURCHASED KEYS</div>
            <div style="font-size: 11px; color: #ff9966;">View all purchased keys with full details</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color: #ff7700; font-size: 18px;"></i>
      </div>
    </div>

  </div>

  <!-- আলাদা JS ফাইল লিংক -->
  <script src="script.js"></script>
</body>
</html>
