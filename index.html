<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebRTC Call Engine</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f8fafc; color: #334155; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Top Display Screen (App Layout Matching) */
        .screen-container { width: 100%; height: 280px; background: #111827; position: relative; display: flex; flex-direction: column; overflow: hidden; }
        .screen-header { padding: 12px 16px; font-size: 13px; font-weight: 700; color: #94a3b8; letter-spacing: 0.5px; text-transform: uppercase; z-index: 2; }
        
        #userList { flex: 1; overflow-y: auto; padding: 0 16px 12px; z-index: 2; }
        .user-card { background: #1f2937; padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #374151; }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; }
        .online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .offline { background: #ef4444; }
        .user-name { font-size: 14px; font-weight: 600; color: #f9fafb; }
        .user-ping-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
        .btn-call { background: #0284c7; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .btn-call:disabled { background: #475569; cursor: not-allowed; }

        /* Empty State */
        #emptyState { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; }
        .empty-icon { width: 40px; height: 40px; fill: #38bdf8; margin-bottom: 8px; }
        .empty-text { font-size: 15px; font-weight: 600; color: #e5e7eb; margin-bottom: 8px; }
        .server-badge { display: flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.1); border: 1px solid #065f46; color: #34d399; font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px; }
        .server-badge.offline { background: rgba(239, 68, 68, 0.1); border-color: #991b1b; color: #f87171; }
        .server-dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; }
        .server-badge.offline .server-dot { background: #f87171; }

        /* Active Video Screen */
        #videoGrid { position: absolute; inset: 0; background: #000; display: none; z-index: 10; }
        #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
        #localVideo { position: absolute; top: 10px; right: 10px; width: 85px; height: 115px; border-radius: 8px; border: 2px solid #38bdf8; object-fit: cover; background: #1e293b; z-index: 12; }
        .call-overlay-hangup { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 15; }
        .btn-hangup { background: #dc2626; color: #fff; border: none; padding: 8px 24px; border-radius: 25px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4); cursor: pointer; }

        /* Bottom Controls UI */
        .controls-container { flex: 1; padding: 20px 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .buttons-row { width: 100%; max-width: 320px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .control-btn { width: 54px; height: 54px; border-radius: 50%; background: transparent; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .control-btn svg { width: 34px; height: 34px; fill: #9ca3af; }
        .control-btn.active svg { fill: #0284c7; }

        .network-card { width: 100%; max-width: 320px; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #4b5563; }
        .ping-green { color: #10b981; }
        .ping-yellow { color: #f59e0b; }
        .ping-red { color: #ef4444; }

        .speaker-row { width: 100%; max-width: 320px; display: flex; align-items: center; gap: 14px; margin-top: 10px; cursor: pointer; padding: 6px 0; }
        .speaker-row svg { width: 30px; height: 30px; fill: #6b7280; }
        .speaker-title { font-size: 15px; font-weight: 700; color: #4b5563; letter-spacing: 0.5px; }

        /* Incoming / Outgoing Call Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal-card { background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 14px; width: 100%; max-width: 300px; padding: 22px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .modal-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
        .modal-card p { font-size: 13px; color: #9ca3af; margin-bottom: 16px; }
        .modal-card input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #4b5563; background: #111827; color: #fff; margin-bottom: 14px; outline: none; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .btn-accept { background: #10b981; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; flex: 1; cursor: pointer; }
        .btn-reject { background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; flex: 1; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Top Web Screen Area -->
    <div class="screen-container">
        <div class="screen-header">Users Online / Offline</div>
        
        <div id="userList"></div>

        <div id="emptyState">
            <svg class="empty-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <div class="empty-text">No Users Found</div>
            <div class="server-badge" id="serverBadge">
                <div class="server-dot"></div>
                <span id="serverStatusText">Server Connected</span>
            </div>
        </div>

        <div id="videoGrid">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="call-overlay-hangup">
                <button class="btn-hangup" onclick="endCall()">
                    <svg style="width:16px;height:16px;fill:#fff;" viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08c-.18-.17-.29-.42-.29-.7 0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
                    End Call
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Controls Area -->
    <div class="controls-container">
        <div class="buttons-row">
            <!-- Cam Switch -->
            <button class="control-btn" onclick="toggleCamera()">
                <svg viewBox="0 0 24 24"><path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 11.5V13H9v2.5L5.5 12 9 8.5V11h6V8.5l3.5 3.5-3.5 3.5z"/></svg>
            </button>
            <!-- Video Toggle -->
            <button class="control-btn" id="btnVideo" onclick="toggleVideo()">
                <svg id="svgVideoOff" viewBox="0 0 24 24"><path d="M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z"/></svg>
                <svg id="svgVideoOn" style="display:none;" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            </button>
            <!-- Mic Toggle -->
            <button class="control-btn" id="btnMic" onclick="toggleMic()">
                <svg id="svgMicOn" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
                <svg id="svgMicOff" style="display:none;" viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l4.07 4.07c-.57.26-1.19.41-1.84.41-3 0-5.3-2.1-5.3-5.1H8c0 3.41 2.72 6.23 6 6.72V22h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>
            </button>
            <!-- Noise Suppression Toggle -->
            <button class="control-btn" id="btnNoise" onclick="toggleNoise()">
                <svg id="svgNoiseOn" viewBox="0 0 24 24"><path d="M14 6h-1V4c0-.55-.45-1-1-1s-1 .45-1 1v2h-1c-.55 0-1 .45-1 1v5c0 .55.45 1 1 1h4c.55 0 1-.45 1-1V7c0-.55-.45-1-1-1zm-1 9v2c0 1.66-1.34 3-3 3s-3-1.34-3-3v-5c0-.55-.45-1-1-1s-1 .45-1 1v5c0 2.76 2.24 5 5 5s5-2.24 5-5v-2h-2z"/></svg>
                <svg id="svgNoiseOff" style="display:none;" viewBox="0 0 24 24"><path d="M21.19 21.19L2.81 2.81 1.39 4.22l5.77 5.77c-.09.32-.16.66-.16 1.01v5c0 2.76 2.24 5 5 5s5-2.24 5-5v-1.17l3.78 3.78 1.41-1.42zM14 11.17V12h-2.83l2.83-.83zM14 6h-1V4c0-.55-.45-1-1-1s-1 .45-1 1v2h-1c-.55 0-1 .45-1 1v1.17l5 5V7c0-.55-.45-1-1-1z"/></svg>
            </button>
        </div>

        <div class="network-card">
            My Network :- <span id="myPingDisplay" class="ping-yellow">Checking...</span>
        </div>

        <div class="network-card">
            Caller Network :- <span id="callerPingDisplay" style="color:#6b7280;">Waiting for call...</span>
        </div>

        <div class="speaker-row" onclick="openSpeakerModal()">
            <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/></svg>
            <div class="speaker-title">SPEAKER CHANGE</div>
        </div>
    </div>

    <!-- Registration Dialog -->
    <div id="nameModal" class="modal" style="display: none;">
        <div class="modal-card">
            <h3>Enter Your Name</h3>
            <p>Your name will be saved for this device</p>
            <input type="text" id="usernameInput" placeholder="Name...">
            <button class="btn-accept" style="width:100%;" onclick="saveUsername()">Save & Enter</button>
        </div>
    </div>

    <!-- Outgoing Call Dialog -->
    <div id="outgoingModal" class="modal" style="display: none;">
        <div class="modal-card">
            <h3 id="outgoingTargetName">Calling...</h3>
            <p id="outgoingStatus">Ringing...</p>
            <button class="btn-reject" style="width:100%;" onclick="endCall()">Cancel Call</button>
        </div>
    </div>

    <!-- Incoming Call Dialog -->
    <div id="incomingModal" class="modal" style="display: none;">
        <div class="modal-card">
            <h3 id="incomingCallerName">Incoming Call</h3>
            <p>wants to video/voice call with you</p>
            <div class="modal-actions">
                <button class="btn-accept" onclick="acceptIncomingCall()">Accept</button>
                <button class="btn-reject" onclick="rejectIncomingCall()">Decline</button>
            </div>
        </div>
    </div>

    <!-- Speaker Options Dialog -->
    <div id="speakerModal" class="modal" style="display: none;">
        <div class="modal-card">
            <h3 style="margin-bottom:12px;">Audio Output</h3>
            <button class="btn-accept" style="width:100%; margin-bottom:8px;" onclick="closeSpeakerModal()">Ear Speaker (Normal)</button>
            <button class="btn-accept" style="width:100%; margin-bottom:8px;" onclick="closeSpeakerModal()">Loudspeaker</button>
            <button class="btn-reject" style="width:100%; background:#4b5563;" onclick="closeSpeakerModal()">Cancel</button>
        </div>
    </div>

<script>
    const firebaseConfig = {
        databaseURL: "https://y-call-e82e2-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "y-call-e82e2",
        storageBucket: "y-call-e82e2.firebasestorage.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myId = localStorage.getItem("webrtc_dev_id") || "dev_" + Math.random().toString(36).substring(2, 9);
    localStorage.setItem("webrtc_dev_id", myId);
    let myName = localStorage.getItem("webrtc_user_name") || "";

    let localStream, peerConnection, currentCallId, pendingOffer, activeCallRef;
    let isVideoOn = false, isAudioOn = true, isNoiseOn = true, currentFacingMode = "user";
    let onlineUsersMap = {};

    const rtcConfig = {
        iceServers: [{ urls: ["stun:stun1.l.google.com:19302", "stun:stun2.l.google.com:19302"] }]
    };

    // Synthesized Sound Engine
    let audioCtx, osc, ringInterval;
    function startRingtone() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            ringInterval = setInterval(() => {
                if(!audioCtx) return;
                osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(480, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            }, 2500);
        } catch(e){}
    }

    function stopRingtone() {
        clearInterval(ringInterval);
        if(audioCtx) { audioCtx.close(); audioCtx = null; }
    }

    // Initialize Application
    window.addEventListener("load", async () => {
        try {
            await navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(s => s.getTracks().forEach(t=>t.stop()));
        } catch(e){}

        if(!myName) {
            document.getElementById("nameModal").style.display = "flex";
        } else {
            initPresence();
        }
    });

    // Sketchware Bridge
    window.initApp = function(deviceId) {
        if(deviceId) {
            myId = deviceId;
            localStorage.setItem("webrtc_dev_id", myId);
        }
        db.ref("users/" + myId).once("value", snap => {
            const val = snap.val();
            if(val && val.name) {
                myName = val.name;
                localStorage.setItem("webrtc_user_name", myName);
                document.getElementById("nameModal").style.display = "none";
                initPresence();
            } else {
                document.getElementById("nameModal").style.display = "flex";
            }
        });
    };

    function saveUsername() {
        const val = document.getElementById("usernameInput").value.trim();
        if(!val) return;
        myName = val;
        localStorage.setItem("webrtc_user_name", myName);
        document.getElementById("nameModal").style.display = "none";
        initPresence();
    }

    function initPresence() {
        const userRef = db.ref("users/" + myId);
        
        db.ref(".info/connected").on("value", snap => {
            const isConn = snap.val() === true;
            const badge = document.getElementById("serverBadge");
            const text = document.getElementById("serverStatusText");
            if(isConn) {
                badge.className = "server-badge";
                text.innerText = "Server Connected";
                userRef.onDisconnect().update({ status: "offline", lastSeen: firebase.database.ServerValue.TIMESTAMP });
                userRef.set({ id: myId, name: myName, status: "online", ping: 40 });
            } else {
                badge.className = "server-badge offline";
                text.innerText = "Disconnected";
            }
        });

        // User Sync
        db.ref("users").on("value", snapshot => {
            const list = document.getElementById("userList");
            const emptyState = document.getElementById("emptyState");
            list.innerHTML = "";
            let users = [];
            onlineUsersMap = {};

            snapshot.forEach(child => {
                if(child.key !== myId) {
                    const u = child.val();
                    users.push(u);
                    onlineUsersMap[u.id] = u;
                }
            });

            if(users.length === 0) {
                emptyState.style.display = "flex";
                list.style.display = "none";
            } else {
                emptyState.style.display = "none";
                list.style.display = "block";
                users.sort((a, b) => (a.status === 'online' ? -1 : 1));

                users.forEach(u => {
                    const isOnline = u.status === "online";
                    const card = document.createElement("div");
                    card.className = "user-card";
                    card.innerHTML = `
                        <div class="user-info">
                            <div class="status-dot ${isOnline ? 'online' : 'offline'}"></div>
                            <div>
                                <div class="user-name">${u.name || 'User'}</div>
                                <div class="user-ping-sub">${isOnline ? (u.ping || 40) + ' ms' : 'Offline'}</div>
                            </div>
                        </div>
                        <button class="btn-call" ${!isOnline ? 'disabled' : ''} onclick="initiateCall('${u.id}', '${u.name}')">
                            ${isOnline ? 'Call' : 'Offline'}
                        </button>
                    `;
                    list.appendChild(card);
                });
            }
        });

        // Incoming Call Detection
        db.ref("calls").on("child_added", snap => {
            const call = snap.val();
            if(call && call.target === myId && call.status === "ringing" && !peerConnection) {
                currentCallId = snap.key;
                activeCallRef = db.ref("calls/" + currentCallId);
                pendingOffer = call.offer;
                
                document.getElementById("incomingCallerName").innerText = (call.callerName || "User") + " Calling...";
                document.getElementById("incomingModal").style.display = "flex";
                startRingtone();
                if(window.AndroidApp) AndroidApp.playRingtone();

                // Listen if Caller cancelled
                activeCallRef.on("value", s => {
                    const val = s.val();
                    if(!val || val.status === "ended" || val.status === "rejected") {
                        resetCallUI();
                    }
                });
            }
        });

        startPingTracker();
    }

    function startPingTracker() {
        setInterval(() => {
            const start = Date.now();
            db.ref("pingCheck").set(start).then(() => {
                const latency = Date.now() - start;
                db.ref("users/" + myId).update({ ping: latency });
                
                const disp = document.getElementById("myPingDisplay");
                if(latency <= 80) {
                    disp.className = "ping-green";
                    disp.innerText = `${latency} ms (Good)`;
                } else if(latency <= 180) {
                    disp.className = "ping-yellow";
                    disp.innerText = `${latency} ms (Medium)`;
                } else {
                    disp.className = "ping-red";
                    disp.innerText = `${latency} ms (Slow!)`;
                }
            }).catch(()=>{});
        }, 3000);
    }

    async function setupStream() {
        if(localStream) localStream.getTracks().forEach(t => t.stop());
        localStream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: { noiseSuppression: isNoiseOn, echoCancellation: true, autoGainControl: true }
        });
        localStream.getVideoTracks().forEach(t => t.enabled = isVideoOn);
        localStream.getAudioTracks().forEach(t => t.enabled = isAudioOn);
        document.getElementById("localVideo").srcObject = localStream;
    }

    // Initiate Call
    async function initiateCall(targetId, targetName) {
        if(!onlineUsersMap[targetId] || onlineUsersMap[targetId].status !== 'online') {
            alert("User is currently offline!");
            return;
        }

        document.getElementById("outgoingTargetName").innerText = "Calling " + (targetName || "User") + "...";
        document.getElementById("outgoingStatus").innerText = "Ringing...";
        document.getElementById("outgoingModal").style.display = "flex";

        startRingtone();
        if(window.AndroidApp) AndroidApp.playRingtone();

        currentCallId = "call_" + Date.now();
        activeCallRef = db.ref("calls/" + currentCallId);

        await setupStream();
        createPeer(activeCallRef);

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await activeCallRef.set({
            caller: myId,
            callerName: myName,
            target: targetId,
            status: "ringing",
            offer: { type: offer.type, sdp: offer.sdp }
        });

        // Listen for Receiver Response
        activeCallRef.on("value", async snap => {
            const val = snap.val();
            if(!val) { resetCallUI(); return; }

            if(val.status === "connected" && val.answer && !peerConnection.currentRemoteDescription) {
                stopRingtone();
                if(window.AndroidApp) AndroidApp.stopRingtone();
                document.getElementById("outgoingModal").style.display = "none";
                document.getElementById("videoGrid").style.display = "block";
                await peerConnection.setRemoteDescription(new RTCSessionDescription(val.answer));
                document.getElementById("callerPingDisplay").innerText = "Connected";
                document.getElementById("callerPingDisplay").style.color = "#10b981";
            } else if(val.status === "rejected" || val.status === "ended") {
                resetCallUI();
                alert("Call Ended / Declined");
            }
        });
    }

    // Accept Incoming Call
    async function acceptIncomingCall() {
        stopRingtone();
        if(window.AndroidApp) AndroidApp.stopRingtone();
        document.getElementById("incomingModal").style.display = "none";
        document.getElementById("videoGrid").style.display = "block";

        await setupStream();
        createPeer(activeCallRef);

        await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        await activeCallRef.update({
            status: "connected",
            answer: { type: answer.type, sdp: answer.sdp }
        });

        document.getElementById("callerPingDisplay").innerText = "Connected";
        document.getElementById("callerPingDisplay").style.color = "#10b981";
    }

    // Reject Incoming Call
    function rejectIncomingCall() {
        stopRingtone();
        if(window.AndroidApp) AndroidApp.stopRingtone();
        if(activeCallRef) {
            activeCallRef.update({ status: "rejected" });
        }
        resetCallUI();
    }

    // End / Cancel Call
    function endCall() {
        stopRingtone();
        if(window.AndroidApp) AndroidApp.stopRingtone();
        if(activeCallRef) {
            activeCallRef.update({ status: "ended" });
            activeCallRef.remove();
        }
        resetCallUI();
    }

    function resetCallUI() {
        stopRingtone();
        if(window.AndroidApp) AndroidApp.stopRingtone();
        document.getElementById("outgoingModal").style.display = "none";
        document.getElementById("incomingModal").style.display = "none";
        document.getElementById("videoGrid").style.display = "none";
        document.getElementById("callerPingDisplay").innerText = "Waiting for call...";
        document.getElementById("callerPingDisplay").style.color = "#6b7280";

        if(peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        if(localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
    }

    function createPeer(callRef) {
        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

        peerConnection.ontrack = e => {
            document.getElementById("remoteVideo").srcObject = e.streams[0];
        };

        peerConnection.onicecandidate = e => {
            if(e.candidate) callRef.child("candidates").push(e.candidate.toJSON());
        };

        callRef.child("candidates").on("child_added", snap => {
            const c = snap.val();
            if(c) peerConnection.addIceCandidate(new RTCIceCandidate(c));
        });
    }

    // Controls
    async function toggleCamera() {
        currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
        if(localStream) {
            const track = localStream.getVideoTracks()[0];
            if(track) track.stop();
            const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
            const newTrack = newStream.getVideoTracks()[0];
            newTrack.enabled = isVideoOn;
            if(peerConnection) {
                const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if(sender) sender.replaceTrack(newTrack);
            }
            localStream.removeTrack(track);
            localStream.addTrack(newTrack);
            document.getElementById("localVideo").srcObject = localStream;
        }
    }

    function toggleVideo() {
        isVideoOn = !isVideoOn;
        document.getElementById("svgVideoOff").style.display = isVideoOn ? "none" : "block";
        document.getElementById("svgVideoOn").style.display = isVideoOn ? "block" : "none";
        document.getElementById("btnVideo").classList.toggle("active", isVideoOn);
        if(localStream) localStream.getVideoTracks().forEach(t => t.enabled = isVideoOn);
    }

    function toggleMic() {
        isAudioOn = !isAudioOn;
        document.getElementById("svgMicOn").style.display = isAudioOn ? "block" : "none";
        document.getElementById("svgMicOff").style.display = isAudioOn ? "none" : "block";
        document.getElementById("btnMic").classList.toggle("active", !isAudioOn);
        if(localStream) localStream.getAudioTracks().forEach(t => t.enabled = isAudioOn);
    }

    async function toggleNoise() {
        isNoiseOn = !isNoiseOn;
        document.getElementById("svgNoiseOn").style.display = isNoiseOn ? "block" : "none";
        document.getElementById("svgNoiseOff").style.display = isNoiseOn ? "none" : "block";
        document.getElementById("btnNoise").classList.toggle("active", !isNoiseOn);
        await setupStream();
    }

    function openSpeakerModal() { document.getElementById("speakerModal").style.display = "flex"; }
    function closeSpeakerModal() { document.getElementById("speakerModal").style.display = "none"; }
</script>
</body>
</html>
